name: Release

# Publishes MeldSDK to CocoaPods trunk when a version tag is pushed.
# SPM needs nothing extra — the git tag IS the SPM release, so pushing the tag is enough for SPM.
# The published pod version is the tag name (a leading "v" is stripped), e.g.:
#   git tag 0.3.0 && git push origin 0.3.0
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   COCOAPODS_TRUNK_TOKEN   your trunk session token (see: pod trunk me --verbose, or ~/.netrc)
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write   # create the GitHub Release

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Lint podspec
        env:
          POD_VERSION: ${{ steps.version.outputs.value }}
        run: pod lib lint MeldSDK.podspec --allow-warnings

      - name: Push to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          POD_VERSION: ${{ steps.version.outputs.value }}
        run: pod trunk push MeldSDK.podspec --allow-warnings

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || true
